[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.88" # MSRV: let chains in edition 2024 need 1.88
license = "MIT"
repository = "https://github.com/speechkit/speechkit"
homepage = "https://github.com/speechkit/speechkit"
keywords = ["speech", "asr", "tts", "speech-to-text", "text-to-speech"]
categories = ["multimedia::audio"]

[workspace.dependencies]
speechkit = { path = "crates/speechkit", version = "=0.5.0" }
speechkit-testkit = { path = "crates/speechkit-testkit" }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
criterion = { version = "0.7", default-features = false }
zeroize = "1"
rubato = { version = "5", default-features = false }
hound = "3.5"
symphonia = { version = "0.6", default-features = false, features = ["aac", "flac", "isomp4", "mkv", "mp3", "ogg", "pcm", "vorbis", "wav"] }
sha2 = "0.11"
sherpa-onnx = { version = "1.13", default-features = false }
tokio = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.30", default-features = false }
axum = { version = "0.8", default-features = false }
cpal = "0.18"
ringbuf = "0.5"
clap = { version = "4", features = ["derive", "env"] }
proptest = "1"
wiremock = "0.6"
assert_cmd = "2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(speechkit_loom)"] } # loom builds

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
cast_precision_loss = "allow" # sample counts (u64 as f32) and PCM conversions trigger it constantly
must_use_candidate = "allow"  # fires on almost every getter
struct_excessive_bools = "allow" # capability sets are naturally flags

# The resampler and decoders are unusably slow unoptimized, and tests
# process seconds of audio.
[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

# `cargo xtask fetch-fixtures` unpacks and hashes gigabytes of models;
# unoptimized, bzip2 alone takes tens of minutes per archive.
[profile.dev.package.libbz2-rs-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Cargo builds build dependencies without debuginfo unless a normal
# dependency shares them. sherpa-onnx-sys's build script shares `tar` with
# xtask, so without this, `--lib` and `--test` runs, which leave out xtask,
# compile a second copy of speechkit.
[profile.dev.build-override]
debug = true
