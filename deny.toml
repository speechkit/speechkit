[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # symphonia (audio decoding). File-level copyleft: only changes to
    # symphonia's own files would have to be shared.
    "MPL-2.0",
    # Mozilla's root certificate list (webpki-roots), used by TLS clients.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # Pure-Rust bzip2, used only by xtask to unpack model archives.
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
