[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # zip 2.4.2 is only sherpa-onnx-sys's build dependency, which unpacks
    # sherpa-onnx's own prebuilt library archive at build time; speechkit
    # never extracts a zip at run time. The fixes need zip 9, which only a
    # new sherpa-onnx release can bring in. Remove these when it does.
    { id = "RUSTSEC-2026-0367", reason = "zip: build-time only, extracting sherpa-onnx's own archive" },
    { id = "RUSTSEC-2026-0368", reason = "zip: build-time only, extracting sherpa-onnx's own archive" },
    { id = "RUSTSEC-2026-0369", reason = "zip: build-time only, extracting sherpa-onnx's own archive" },
    { id = "RUSTSEC-2026-0429", reason = "zip: build-time only, extracting sherpa-onnx's own archive" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # symphonia (audio decoding). File-level copyleft: only changes to
    # symphonia's own files would have to be shared.
    "MPL-2.0",
    # Mozilla's root certificate list (webpki-roots), used by TLS clients.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # Pure-Rust bzip2, used only by xtask to unpack model archives.
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
